# This is a Databricks asset bundle definition for dabproject.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dabproject
  uuid: 18f43755-081d-408e-9be0-1a0ffb44b368

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

include:
  - resources/*.yml
  - resources/*/*.yml

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-c01c4cf7-137b.cloud.databricks.com/

  prod:
    mode: production
    workspace:
      host: https://dbc-c01c4cf7-137b.cloud.databricks.com/
      # We explicitly deploy to /Workspace/Users/cvenkateshh1997@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/cvenkateshh1997@gmail.com/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: cvenkateshh1997@gmail.com
        level: CAN_MANAGE
